  <script>
    (()=>{
      const root=document.getElementById('admin-motion-review-v6');
      const query=s=>root.querySelector(s),all=s=>[...root.querySelectorAll(s)];
      const media=matchMedia('(prefers-reduced-motion: reduce)');
      const tuning={duration:220,depth:.22};
      const state={music:65,effects:72,musicOn:true,effectsOn:true,count:3,nav:'工作台',open:false,reduced:media.matches,revision:0,motionVersion:6};
      let counting=false,shownCount=3,drag=null,knobPointer=null,blockCardClick=false;
      const activeReels=new Set();
      const clamp=v=>Math.max(0,Math.min(100,Math.round(Number(v)||0)));
      const reduced=()=>state.reduced||media.matches;
      const announce=message=>{query('.announcement').textContent=message;};
      function save(){state.revision++;globalThis.openai?.setWidgetState?.({modelContent:{review:'顺滑节奏评审',music:state.music,effects:state.effects,musicOn:state.musicOn,effectsOn:state.effectsOn,reduced:state.reduced},privateContent:{...state}})?.catch?.(()=>{});}

      // Closed-form critical damping preserves the visible position and velocity
      // when a new target arrives; pointer updates are coalesced to one paint/frame.
      function motion(initial,paint){
        let x=initial,target=initial,velocity=0,frame=0,last=0,direct=false,omega=36;
        function cancel(){if(frame)cancelAnimationFrame(frame);frame=0;last=0;}
        function jump(value){cancel();x=target=value;velocity=0;paint(x);}
        function tick(time){
          frame=0;
          if(reduced()){jump(target);return;}
          const dt=Math.min(.032,Math.max(.001,(time-last)/1000));last=time;
          if(direct){x=target;velocity=0;paint(x);last=0;return;}
          const delta=x-target,term=velocity+omega*delta,decay=Math.exp(-omega*dt);
          x=target+(delta+term*dt)*decay;
          velocity=(velocity-omega*term*dt)*decay;
          if(Math.abs(x-target)<.015&&Math.abs(velocity)<.05){x=target;velocity=0;paint(x);last=0;return;}
          paint(x);frame=requestAnimationFrame(tick);
        }
        return {
          jump,
          hold(){cancel();target=x;velocity=0;return x;},
          value(){return x;},
          to(value,mode='smooth',rate=36){
            target=value;direct=mode==='drag';omega=rate;
            if(reduced()){jump(value);return;}
            if(!frame){last=performance.now();frame=requestAnimationFrame(tick);}
          }
        };
      }
      const dialMotion=new Map(all('[data-channel]').map(el=>{
        const id=el.dataset.channel;
        return [id,motion(state[id],value=>{const visual=Math.max(0,Math.min(100,value));el.style.setProperty('--value',visual.toFixed(4));el.querySelector('.dial-value').textContent=Math.round(visual)+'%';})];
      }));
      const stack=query('.stack-area'),handle=query('.drag-handle');
      const pullMotion=motion(0,value=>stack.style.setProperty('--pull',value.toFixed(3)+'px'));
      const dialRate=()=>7/(tuning.duration*.7/1000);
      const pullRate=()=>7/((tuning.duration+40)/1000);

      function setChannel(id,value,{mode='smooth',preserveInput=false}={}){
        const raw=Math.max(0,Math.min(100,Number(value)||0));
        state[id]=clamp(raw);
        const el=query('[data-channel="'+id+'"]');
        el.querySelector('.dial-range').value=state[id];
        if(!preserveInput)el.querySelector('.number-input').value=state[id];
        const mover=dialMotion.get(id),target=mode==='drag'?raw:state[id];
        if(mode==='jump')mover.jump(target);else mover.to(target,mode,dialRate());
      }
      function renderSwitch(id){const el=query('[data-channel="'+id+'"]'),on=state[id+'On'];el.dataset.on=String(on);el.querySelector('.switch').setAttribute('aria-checked',String(on));el.querySelector('.switch-state').textContent=on?'已开启':'已关闭';}
      function renderNav(){all('[data-nav]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.nav===state.nav)));query('[data-selected]').textContent='实体按键：'+state.nav+'已按下';}
      function setOpen(on,notify=false){state.open=on;stack.dataset.open=String(on);all('[aria-controls="motion-v6-task-details"]').forEach(el=>el.setAttribute('aria-expanded',String(on)));query('.detail-key').textContent=on?'收起详情':'查看详情';query('.details').inert=!on;if(notify){announce(on?'待办示例已展开':'待办示例已收起');save();}}
      function renderCount(value){const text=String(value).padStart(3,'0');all('.digit').forEach((el,i)=>el.replaceChildren(Object.assign(document.createElement('span'),{textContent:text[i]})));query('.roller-row').setAttribute('aria-label','待审核示例：'+value+'项');}
      function restore(saved){
        if(!saved||saved.motionVersion!==6)return;
        ['music','effects'].forEach(id=>{if(Number.isFinite(saved[id]))state[id]=clamp(saved[id]);if(typeof saved[id+'On']==='boolean')state[id+'On']=saved[id+'On'];});
        if(['工作台','声音工作室','发布审批'].includes(saved.nav))state.nav=saved.nav;
        if(Number.isInteger(saved.count))state.count=Math.max(0,Math.min(999,saved.count));
        if(typeof saved.open==='boolean')state.open=saved.open;
        if(typeof saved.reduced==='boolean')state.reduced=saved.reduced;
        if(Number.isSafeInteger(saved.revision))state.revision=Math.max(0,saved.revision);
      }
      function applyTuning(){root.style.setProperty('--duration',tuning.duration+'ms');root.style.setProperty('--depth',tuning.depth);}
      function syncReduced(){
        root.dataset.reduced=String(reduced());query('[data-reduce]').checked=state.reduced;
        if(reduced()){dialMotion.forEach((m,id)=>m.jump(state[id]));pullMotion.jump(0);activeReels.forEach(a=>a.cancel());}
      }
      function render(){applyTuning();syncReduced();['music','effects'].forEach(id=>{setChannel(id,state[id],{mode:'jump'});renderSwitch(id);});renderNav();setOpen(state.open);pullMotion.jump(0);if(!counting){shownCount=state.count;renderCount(shownCount);}}
      restore(globalThis.openai?.widgetState?.privateContent);render();
      all('[data-nav]').forEach(el=>el.addEventListener('click',()=>{state.nav=el.dataset.nav;renderNav();announce(state.nav+'按键已选中，当前为同一控件评审页');save();}));
      query('[data-reduce]').addEventListener('change',e=>{state.reduced=e.target.checked;syncReduced();announce(reduced()?'已减少动态效果':'已恢复顺滑动效');save();});
      media.addEventListener('change',syncReduced);
      all('[data-channel]').forEach(el=>{
        const id=el.dataset.channel,input=el.querySelector('.dial-range'),number=el.querySelector('.number-input'),dial=el.querySelector('.dial');
        el.querySelector('.switch').addEventListener('click',()=>{state[id+'On']=!state[id+'On'];renderSwitch(id);announce((id==='music'?'背景音乐':'游戏音效')+'示例已'+(state[id+'On']?'开启':'关闭'));save();});
        input.addEventListener('input',()=>setChannel(id,input.value));input.addEventListener('change',save);
        number.addEventListener('input',()=>{if(number.value!==''&&number.validity.valid){setChannel(id,number.value,{preserveInput:true});save();}});
        number.addEventListener('change',()=>{setChannel(id,number.value);save();});
        function angle(e){const r=dial.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;return Math.hypot(dx,dy)<12?null:Math.atan2(dx,-dy)*180/Math.PI;}
        function update(e){
          const nextAngle=angle(e);if(nextAngle===null)return;
          if(knobPointer.angle===null){knobPointer.angle=nextAngle;return;}
          const delta=((nextAngle-knobPointer.angle+540)%360)-180;
          knobPointer.angle=nextAngle;
          knobPointer.value=Math.max(0,Math.min(100,knobPointer.value+delta/2.7));
          setChannel(id,knobPointer.value,{mode:'drag'});
        }
        input.addEventListener('pointerdown',e=>{if(knobPointer||e.button!==0)return;e.preventDefault();input.focus({preventScroll:true});knobPointer={id,pointer:e.pointerId,angle:angle(e),value:dialMotion.get(id).hold()};input.setPointerCapture(e.pointerId);dial.classList.add('dragging');});
        input.addEventListener('pointermove',e=>{if(knobPointer?.id===id&&knobPointer.pointer===e.pointerId)update(e);});
        function end(e){if(knobPointer?.id!==id||knobPointer.pointer!==e.pointerId)return;if(e.type==='pointerup')update(e);knobPointer=null;dial.classList.remove('dragging');dialMotion.get(id).to(state[id],'smooth',65);save();}
        input.addEventListener('pointerup',end);input.addEventListener('pointercancel',end);input.addEventListener('lostpointercapture',end);
      });

      async function drainCounter(){
        if(counting)return;counting=true;
        try{
          while(shownCount!==state.count){
            const target=state.count,old=String(shownCount).padStart(3,'0'),next=String(target).padStart(3,'0'),round=[];
            if(!reduced()){
              all('.digit').forEach((el,i)=>{
                if(old[i]===next[i])return;
                const steps=(Number(next[i])-Number(old[i])+10)%10,reel=document.createElement('div');
                for(let n=0;n<=steps;n++){const digit=document.createElement('span');digit.textContent=(Number(old[i])+n)%10;reel.append(digit);}
                el.replaceChildren(reel);
                const a=reel.animate([{transform:'translateY(0)'},{transform:'translateY(-'+steps*48+'px)'}],{duration:tuning.duration+60,delay:i*10,easing:'cubic-bezier(.2,.6,.2,1)',fill:'forwards'});
                activeReels.add(a);round.push(a);
              });
              await Promise.all(round.map(a=>a.finished.catch(()=>{})));
            }
            shownCount=reduced()?state.count:target;renderCount(shownCount);
            round.forEach(a=>{activeReels.delete(a);a.cancel();});
          }
          announce('待审核示例更新为'+shownCount+'项');
        }finally{counting=false;}
      }
      query('[data-count]').addEventListener('click',()=>{state.count=(state.count+1)%1000;save();void drainCounter();});
      handle.addEventListener('pointerdown',e=>{if(e.button!==0||drag)return;const startPull=pullMotion.hold();drag={id:e.pointerId,y:e.clientY,startPull,distance:startPull,moved:0};blockCardClick=false;handle.setPointerCapture(e.pointerId);stack.classList.add('dragging');});
      handle.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;drag.moved=Math.max(drag.moved,Math.abs(e.clientY-drag.y));drag.distance=Math.max(0,Math.min(76,drag.startPull+(e.clientY-drag.y)*.7));pullMotion.to(reduced()?0:drag.distance,'drag');});
      handle.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const {distance,moved}=drag;drag=null;stack.classList.remove('dragging');blockCardClick=moved>4;pullMotion.to(0,'smooth',pullRate());if(distance>=56)setOpen(true,true);});
      const cancel=e=>{if(drag&&drag.id===e.pointerId){drag=null;blockCardClick=true;stack.classList.remove('dragging');pullMotion.to(0,'smooth',pullRate());}};
      handle.addEventListener('pointercancel',cancel);handle.addEventListener('lostpointercapture',cancel);
      handle.addEventListener('click',e=>{if(blockCardClick&&e.detail!==0){e.preventDefault();blockCardClick=false;return;}blockCardClick=false;pullMotion.to(0,'smooth',pullRate());setOpen(!state.open,true);});
      query('.detail-key').addEventListener('click',()=>{pullMotion.to(0,'smooth',pullRate());setOpen(!state.open,true);});
      window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.privateContent;if(saved?.motionVersion===6&&Number.isSafeInteger(saved.revision)&&saved.revision>state.revision&&!drag&&!knobPointer&&!counting){restore(saved);render();}});
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyTuning});tweak.addSlider(tuning,'duration',{label:'节奏基准',min:180,max:300,step:10,unit:'ms'});}
    })();
</script>
</div>
