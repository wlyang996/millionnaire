<script>
(() => {
  const root=document.getElementById('millionnaire-neon-directions');
  const contexts=[];
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const chrome=()=>`<aside class="nc-sidebar"><div class="nc-brand"><span class="nc-brand-mark">${icon('gamepad-2')}</span><div><strong>大富翁</strong><small>CONTROL CENTER</small></div></div><nav aria-label="控制台预览导航"><button type="button" class="nc-nav-button cursor-interaction" data-screen="overview" aria-pressed="true">${icon('orbit')}运营总览</button><button type="button" class="nc-nav-button cursor-interaction" data-screen="audio" aria-pressed="false">${icon('music-2')}声音工作室</button><span class="nc-nav-static">${icon('sliders-horizontal')}玩法配置</span><span class="nc-nav-static">${icon('users-round')}人物素材</span><span class="nc-nav-static">${icon('history')}版本中心</span></nav><div class="nc-sidebar-footer">游戏运营工作区<br>RULES · AVATARS · AUDIO</div></aside><div class="nc-main"><header class="nc-topbar"><b>GAME OPERATIONS</b><div class="nc-chrome-state"><span><span class="nc-dot"></span>方案示例</span><span>管理员</span></div></header><div class="nc-body"></div><footer class="nc-footer"><span>布局与配色预览 · 非线上数据</span><span class="nc-feedback" aria-live="polite"></span></footer></div>`;
  const trend=()=>`<svg class="nc-trend" viewBox="0 0 440 180" role="img" aria-label="近七天对局数示例：14、23、19、31、12、27、16局"><text x="4" y="15">对局（局）</text><line class="nc-trend-rule" x1="32" x2="426" y1="45" y2="45"/><line class="nc-trend-rule" x1="32" x2="426" y1="95" y2="95"/><line class="nc-trend-rule" x1="32" x2="426" y1="145" y2="145"/><text x="4" y="49">30</text><text x="4" y="99">15</text><text x="15" y="149">0</text>${[14,23,19,31,12,27,16].map((v,i)=>`<rect class="nc-trend-bar" x="${48+i*54}" y="${145-v*3.2}" width="22" height="${v*3.2}" rx="2"/><text x="${59+i*54}" y="${137-v*3.2}" text-anchor="middle">${v}</text><text x="${59+i*54}" y="164" text-anchor="middle">${8+i}日</text>`).join('')}<text x="425" y="179" text-anchor="end">日期 · 10月</text></svg>`;
  const overview=()=>`<div class="nc-title-row"><div><div class="nc-eyebrow">OPERATIONS / OVERVIEW</div><h2>游戏运营控制台</h2><div class="nc-title-sub">房间运行、玩法版本与声音工作室</div></div><button type="button" class="nc-button cursor-interaction" data-open-audio>${icon('headphones')}进入声音工作室</button></div><div class="nc-metrics"><div class="nc-metric"><small>近7天对局 · 示例</small><strong>142</strong></div><div class="nc-metric"><small>参与玩家 · 人次</small><strong>436</strong></div><div class="nc-metric"><small>当前实例房间</small><strong>02</strong></div><div class="nc-metric"><small>观战人数</small><strong>02</strong></div></div><div class="nc-overview-grid"><section class="nc-panel"><div class="nc-panel-head"><h3>${icon('chart-no-axes-combined')}近7天对局数</h3><small>页面示例</small></div>${trend()}</section><section class="nc-panel nc-workspace"><div class="nc-panel-head"><h3>${icon('layers')}生效版本</h3><small>工作室</small></div><div class="nc-version-row"><span>${icon('sliders-horizontal')}玩法规则</span><b>#12</b></div><div class="nc-version-row"><span>${icon('users-round')}人物素材</span><b>#03</b></div><div class="nc-version-row"><span>${icon('music-2')}声音配置</span><b>#07</b></div></section></div><section class="nc-panel"><div class="nc-panel-head"><h3>${icon('radio-tower')}实时房间</h3><small>当前实例 · 示例</small></div><div class="nc-room-grid nc-room-header"><small>房间号</small><small>运行状态</small><small>参与人数</small><small>规则版本</small></div><div class="nc-room-grid"><span class="nc-room-code">123456</span><span class="nc-room-state">● 对局中 · 第7轮</span><span>4 人</span><span>#12</span></div><div class="nc-room-grid"><span class="nc-room-code">345678</span><span class="nc-room-state waiting">● 等待开局</span><span>2 人</span><span>#11</span></div></section>`;
  function audio(state){return `<div class="nc-title-row"><div><div class="nc-eyebrow">AUDIO / STUDIO</div><h2>声音控制台</h2><div class="nc-title-sub">场景音乐 · 独立音效 · 局部循环</div></div><button type="button" class="nc-button nc-button-primary cursor-interaction" data-save>${icon('check')}保存草稿示意</button></div><div class="nc-sound-grid"><section class="nc-panel"><div class="nc-panel-head"><h3>${icon('audio-lines')}波形与局部试听</h3><small>音乐素材 · 示意</small></div><div class="nc-track-info"><div><strong>晨光小镇</strong><div class="nc-muted">大厅 / 棋盘 · PCM WAV</div></div><span class="nc-muted">34.3 秒</span></div><div class="nc-wave" aria-label="音乐波形示意">${Array.from({length:48},(_,i)=>`<span style="height:${14+((i*19+i*i*7)%68)}%"></span>`).join('')}</div><div class="nc-player-actions"><button type="button" class="nc-button cursor-interaction" data-pulse>${icon('sparkles')}预览节拍动效</button><label class="nc-check"><input type="checkbox" data-loop ${state.loop?'checked':''}/>循环试听</label></div><div class="nc-muted">区间 00:00—00:34.3 · UI示意</div></section><section class="nc-panel nc-sound-settings"><div class="nc-panel-head"><h3>${icon('sliders-horizontal')}声音通道</h3><small>默认音量</small></div><div class="nc-channel"><label>背景音乐<output data-music-value>${state.music}%</output></label><input type="range" min="0" max="100" value="${state.music}" data-volume="music" aria-label="背景音乐音量示意"/></div><div class="nc-channel fx"><label>独立音效<output data-effects-value>${state.effects}%</output></label><input type="range" min="0" max="100" value="${state.effects}" data-volume="effects" aria-label="独立音效音量示意"/></div><div class="nc-channel"><label style="color:var(--nc-gold)">切换淡入淡出<output>400 ms</output></label></div></section></div><section class="nc-panel"><div class="nc-panel-head"><h3>${icon('list-music')}场景选曲</h3><small>音频版本 #07</small></div><div class="nc-mini-track"><span>大厅 / 棋盘</span><span style="color:var(--nc-accent)">晨光小镇</span></div><div class="nc-mini-track"><span>好友房间 / 系列赛</span><span style="color:var(--nc-other)">好友开局</span></div><div class="nc-mini-track"><span>骰子 / 金币 / 动作反馈</span><span style="color:var(--nc-pink)">11 项独立音效</span></div></section>`}
  function remember(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{preview:'科技感管理端',layouts:contexts.map(c=>({direction:c.name,screen:c.state.screen,accent:c.state.accent,density:c.state.density}))},privateContent:{states:contexts.map(c=>c.state)}}).catch(()=>{})}
  function paint(context){const {app,state}=context;app.style.setProperty('--nc-glow',`${state.glow}%`);app.style.setProperty('--nc-radius',`${state.radius}px`);app.style.setProperty('--nc-accent',state.accent);app.dataset.density=state.density;context.drawChart?.()}
  function chart(context){context.observer?.disconnect();const svg=context.app.querySelector('.nc-trend');if(!svg){context.drawChart=null;return}context.drawChart=()=>{const width=Math.round(svg.getBoundingClientRect().width);if(width<100)return;const left=32,right=width-12,step=(right-left)/7,bar=Math.min(23,step*.48);svg.setAttribute('viewBox',`0 0 ${width} 180`);svg.innerHTML=`<title>近7天对局数 · 页面示例</title><text x="4" y="15">对局（局）</text>${[0,15,30].map(v=>`<line class="nc-trend-rule" x1="${left}" x2="${right}" y1="${145-v*3.2}" y2="${145-v*3.2}"/><text x="${v?4:15}" y="${149-v*3.2}">${v}</text>`).join('')}${[14,23,19,31,12,27,16].map((v,i)=>{const x=left+step*(i+.5);return `<rect class="nc-trend-bar" x="${x-bar/2}" y="${145-v*3.2}" width="${bar}" height="${v*3.2}" rx="2"/><text x="${x}" y="${137-v*3.2}" text-anchor="middle">${v}</text>${width>=360 || i%2===0?`<text x="${x}" y="164" text-anchor="middle">${8+i}日</text>`:''}`}).join('')}<text x="${right}" y="179" text-anchor="end">日期 · 10月</text>`};context.drawChart();if(window.ResizeObserver){context.observer=new ResizeObserver(context.drawChart);context.observer.observe(svg)}}
  function display(context){context.app.querySelector('.nc-body').innerHTML=context.state.screen==='audio'?audio(context.state):overview();context.app.querySelectorAll('[data-screen]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.screen===context.state.screen)));context.app.querySelector('.nc-feedback').textContent='';chart(context);if(window.lucide)window.lucide.createIcons({attrs:{width:17,height:17}})}
  function restore(saved){if(!saved?.privateContent?.states)return;contexts.forEach((context,i)=>{const s=saved.privateContent.states[i];if(!s)return;context.state.screen=s.screen==='audio'?'audio':'overview';context.state.music=Number.isFinite(s.music)?Math.max(0,Math.min(100,s.music)):65;context.state.effects=Number.isFinite(s.effects)?Math.max(0,Math.min(100,s.effects)):65;context.state.loop=s.loop!==false;if(/^#[0-9a-f]{6}$/i.test(s.accent))context.state.accent=s.accent;context.state.glow=Number.isFinite(s.glow)?Math.max(0,Math.min(70,s.glow)):28;context.state.radius=Number.isFinite(s.radius)?Math.max(0,Math.min(12,s.radius)):6;context.state.density=s.density==='comfortable'?'comfortable':'compact';paint(context);display(context)})}
  root.querySelectorAll('.nc-app').forEach((app,i)=>{const name=i===0?'深空青蓝':'赛博紫红',state={screen:'overview',music:65,effects:65,loop:true,glow:28,radius:6,accent:i===0?'#44d9ed':'#d69aff',density:'compact'};app.innerHTML=chrome();const context={app,name,state};contexts.push(context);paint(context);display(context);
    app.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.screen || button.hasAttribute('data-open-audio')){state.screen=button.dataset.screen || 'audio';display(context);remember()}if(button.hasAttribute('data-save'))app.querySelector('.nc-feedback').textContent='预览草稿已更新 · 此处为设计示意';if(button.hasAttribute('data-pulse')){const wave=app.querySelector('.nc-wave');wave.classList.remove('nc-pulse');void wave.offsetWidth;wave.classList.add('nc-pulse');app.querySelector('.nc-feedback').textContent='节拍光标与霓虹反馈示意'}});
    app.addEventListener('input',event=>{const input=event.target;if(input.dataset.volume){const key=input.dataset.volume;state[key]=Number(input.value);app.querySelector(`[data-${key}-value]`).textContent=input.value+'%';remember()}});
    app.addEventListener('change',event=>{if(event.target.hasAttribute('data-loop')){state.loop=event.target.checked;remember()}});
    if(globalThis.Tweak){const tweak=new Tweak({container:app,onChange:()=>{paint(context);remember()}});tweak.addColorPicker(state,'accent',{label:'主霓虹色',reference:'--nc-accent'});tweak.addSlider(state,'glow',{label:'霓虹强度',min:0,max:70,unit:'%',reference:'--nc-glow'});tweak.addSlider(state,'radius',{label:'面板圆角',min:0,max:12,unit:'px',reference:'--nc-radius'});tweak.addSelect(state,'density',{label:'布局密度',options:[{label:'紧凑控制台',value:'compact'},{label:'舒展工作室',value:'comfortable'}],reference:'nc.density'})}
  });
  restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
})();
</script>
