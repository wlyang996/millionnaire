# 云托管要求监听端口与控制台"端口"一致（当前为 80），可用环境变量 PORT 覆盖
server:
  port: ${PORT:80}
  # 在云托管的 HTTPS 代理后面：识别 X-Forwarded-* 头，跳转一律用相对地址（否则会拼出 https://域名:80）
  forward-headers-strategy: framework
  tomcat:
    use-relative-redirects: true

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # 默认不连库：数据源与 Flyway 都关闭，服务照常启动。
  # 在云托管环境变量里设置 SPRING_PROFILES_ACTIVE=db（并配好 MYSQL_*）后才启用，见 application-db.yml。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

millionnaire:
  cos:
    bucket: ${COS_BUCKET:}
    region: ${COS_REGION:}
    # 微信云托管容器内通过 /_/cos/getauth 自动取得临时凭证，不配置长期密钥。
  auth:
    # 测试身份登录（POST /api/auth/test-login）。正式上线前在云托管环境变量里设 TEST_LOGIN_ENABLED=false
    test-login-enabled: ${TEST_LOGIN_ENABLED:true}
  wechat:
    # 微信小游戏登录（POST /api/auth/wx-login）。只从环境变量读，不进仓库；不配时该接口返回 WECHAT_NOT_CONFIGURED
    app-id: ${WECHAT_APPID:}
    app-secret: ${WECHAT_APPSECRET:}
  admin:
    # 仅空账号表初始化；已有账号不会被环境变量覆盖，旧 ADMIN_PASSWORD 不再有效。
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    allow-in-memory: ${ADMIN_ALLOW_IN_MEMORY:false}
    bcrypt-strength: ${ADMIN_BCRYPT_STRENGTH:12}
    session-hours: ${ADMIN_SESSION_HOURS:12}
    max-failures: ${ADMIN_MAX_FAILURES:5}
    lock-minutes: ${ADMIN_LOCK_MINUTES:5}
    ip-attempts: ${ADMIN_IP_ATTEMPTS:30}
    ip-window-seconds: ${ADMIN_IP_WINDOW_SECONDS:60}
    trusted-proxies: ${ADMIN_TRUSTED_PROXIES:}
